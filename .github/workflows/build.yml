name: Build ClearChat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build ClearChat
        run: npm run build

      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: clearchat-build
          path: dist/
